name: space_flutter
description: Space desktop workspace, matching the native baseline.
publish_to: none
version: 2.3.4+21
environment:
  sdk: '>=3.13.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqlite3: ^3.8.0
  crypto: ^3.0.6
  cryptography: ^2.7.0
  uuid: ^4.5.1
  ffi: ^2.1.4
  path: ^1.9.1
  unorm_dart: ^0.3.3
  flutter_quill: ^11.6.0
  archive: ^4.6.0
  desktop_drop: ^0.7.0
  image: ^4.12.0
  pdf: ^3.13.1
  printing: 5.15.1
  pdfium_flutter: 0.4.1
  space_ocr:
    path: packages/space_ocr
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/models/ppocrv6/
  fonts:
    - family: PhosphorSettings
      fonts:
        - asset: assets/icons/PhosphorSettings.ttf
